<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripciones a Talleres</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gestión de Inscripciones a Talleres</h1>
      <p>Colegio Nacional EMD Asunción Escalada - BTI</p>
    </header>

    <!-- Formulario de Registro / Edición -->
    <section class="card">
      <h2 id="form-titulo">Nueva Inscripción</h2>
      <form id="form-inscripcion">
        <input type="hidden" id="registro-id">

        <div class="form-grid">
          <div class="form-group">
            <label for="alias">Alias del participante:</label>
            <input type="text" id="alias" placeholder="Ej: Maria_BTI" required>
          </div>

          <div class="form-group">
            <label for="taller">Taller:</label>
            <select id="taller" required>
              <option value="">Seleccione un taller...</option>
              <option value="Teatro">Teatro</option>
              <option value="Fotografía">Fotografía</option>
              <option value="Robótica">Robótica</option>
              <option value="Música">Música</option>
            </select>
          </div>

          <div class="form-group">
            <label for="curso">Curso:</label>
            <input type="text" id="curso" placeholder="Ej: 3ro BTI" required>
          </div>

          <div class="form-group">
            <label for="fecha_inscripcion">Fecha de inscripción:</label>
            <input type="date" id="fecha_inscripcion" required>
          </div>

          <div class="form-group">
            <label for="turno">Turno:</label>
            <select id="turno" required>
              <option value="">Seleccione un turno...</option>
              <option value="Mañana">Mañana</option>
              <option value="Tarde">Tarde</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-guardar" class="btn-primary">Guardar Inscripción</button>
          <button type="button" id="btn-cancelar" class="btn-secondary oculto">Cancelar Edición</button>
        </div>
      </form>
    </section>

    <!-- Filtro y Tabla de Participantes -->
    <section class="card">
      <div class="table-header">
        <h2>Lista de Participantes</h2>
        <div class="filter-group">
          <label for="filtro-taller">Filtrar por taller:</label>
          <select id="filtro-taller">
            <option value="Todos">Todos los talleres</option>
            <option value="Teatro">Teatro</option>
            <option value="Fotografía">Fotografía</option>
            <option value="Robótica">Robótica</option>
            <option value="Música">Música</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Alias</th>
              <th>Taller</th>
              <th>Curso</th>
              <th>Fecha Inscripción</th>
              <th>Turno</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="6" style="text-align:center;">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
